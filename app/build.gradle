plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "tfdev.dice"
    compileSdk 36

    defaultConfig {
        applicationId "tfdev.dice"
        // Play Protect's automatic (on-device) scanning requires at least 24 - a lower
        // minSdk still builds and installs fine, but Play Console rejects the upload.
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(path: ':Engine3D')

    testImplementation 'junit:junit:4.13.2'
    // Bumped from 1.1.3/3.4.0: those versions' own registerReceiver calls (inside
    // ActivityScenario's result-waiting receiver) don't pass RECEIVER_EXPORTED/
    // RECEIVER_NOT_EXPORTED, which targeting API 33+ requires - a SecurityException on
    // every ActivityScenario.launch() once targetSdk went to 36.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}